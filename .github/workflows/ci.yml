name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test MtgParty.sln -c Release
      - name: Publicar ejecutable de Windows
        run: dotnet publish src/MtgParty.Desktop -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: MesaDelCaos-win-x64
          path: publish/MesaDelCaos.exe
      # Cada push a main publica una versión nueva; el link releases/latest/download/MesaDelCaos.exe apunta siempre a la última.
      - name: Crear versión descargable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Mesa del Caos 0.1.${{ github.run_number }}
          body: Configurador de escritorio del party game de Commander. Descargá MesaDelCaos.exe y abrilo en Windows; no hace falta instalar nada.
          files: publish/MesaDelCaos.exe
